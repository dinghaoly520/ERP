name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: TypeScript type check (api)
        run: pnpm --filter api exec tsc --noEmit

      # TODO: 加 lint(需先在 api/package.json 装 eslint 依赖)
      # TODO: 加 unit test(需先修 3 个 pre-existing 失败: project-management / ai / expert-admin spec mock)
