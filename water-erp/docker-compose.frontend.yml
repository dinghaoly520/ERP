# =============================================================================
# 新增文件 —— water-erp 前端门户编排（不修改原 docker-compose.yml）
#
# 原 docker-compose.yml 负责基础设施（postgres / pgbouncer / redis / minio），
# 本文件只负责 5 个前端门户：
#   3002 信息门户主页   apps/public-portal
#   3004 供应商门户     apps/supplier-portal-next
#   3005 采购管理端     apps/web
#   3006 专家门户       apps/expert-portal
#   3007 开标主持端     apps/bid-portal
#
# 用法（在 water-erp 目录下执行，无需改动仓库任何原文件）：
#   docker compose -f docker-compose.frontend.yml up -d --build
#   docker compose -f docker-compose.frontend.yml ps
#   docker compose -f docker-compose.frontend.yml down
#
# 后端地址写在同目录 .env.frontend（本包已提供），或直接改 API_ORIGIN。
# 5 个服务共用 docker/frontend/Dockerfile 构建的同一个镜像。
# =============================================================================

x-portal-common: &portal-common
  build:
    context: .
    dockerfile: Dockerfile
    # 构建容器使用宿主机网络栈：宿主机有网但容器内 DNS 报 EAI_AGAIN 时的标准解法，
    # 不需要重启 docker 守护进程（不影响其他在跑的容器）。宿主机 DNS 正常时可删掉。
    network: host
    args:
      # 构建期固化 public/expert/bid 三门户的 /api rewrites 目标
      API_ORIGIN: ${API_ORIGIN:-http://10.60.14.14:4001}
      # 依赖下载源（国内/内网必须能访问到这个地址，否则 pnpm install 会 EAI_AGAIN）
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
  image: water-erp-portal:${PORTAL_TAG:-1.0.0}
  restart: unless-stopped
  # 宿主机跑后端时容器内可用 host.docker.internal（Linux 需 host-gateway）
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    # 运行期生效：web(3005) 与 supplier(3004) 走 server 端 src/proxy.ts
    API_ORIGIN: ${API_ORIGIN:-http://10.60.14.14:4001}
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"

x-portal-healthcheck: &portal-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 90s

services:
  # ── 3002 信息门户主页（全系统登录入口，公开）────────────────────────
  portal-3002:
    <<: *portal-common
    container_name: water-portal-3002
    command: sh -c "pnpm --filter public-portal exec next start -H 0.0.0.0 -p 3002"
    ports:
      - "${PUB_PORT:-13002}:13002"
    healthcheck:
      <<: *portal-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]

  # ── 3004 供应商门户（Next 重写版，仓库现行版本）─────────────────────
  portal-3004:
    <<: *portal-common
    container_name: water-portal-3004
    command: sh -c "pnpm --filter supplier-portal-next exec next start -H 0.0.0.0 -p 3004"
    ports:
      - "${SUP_PORT:-3004}:3004"
    healthcheck:
      <<: *portal-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]

  # ── 3005 采购管理端（统一采购工作台）───────────────────────────────
  portal-3005:
    <<: *portal-common
    container_name: water-portal-3005
    # 根 package.json 的 start 脚本没有 -p/-H，这里显式补齐
    command: sh -c "pnpm --filter web exec next start -H 0.0.0.0 -p 3005"
    ports:
      - "${WEB_PORT:-3005}:3005"
    healthcheck:
      <<: *portal-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]

  # ── 3006 专家门户（含 mediapipe 人脸核验）──────────────────────────
  portal-3006:
    <<: *portal-common
    container_name: water-portal-3006
    command: sh -c "pnpm --filter expert-portal exec next start -H 0.0.0.0 -p 3006"
    ports:
      - "${EXP_PORT:-3006}:3006"
    healthcheck:
      <<: *portal-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]

  # ── 3007 开标主持端（开评标管理端）─────────────────────────────────
  portal-3007:
    <<: *portal-common
    container_name: water-portal-3007
    command: sh -c "pnpm --filter bid-portal exec next start -H 0.0.0.0 -p 3007"
    ports:
      - "${BID_PORT:-3007}:3007"
    healthcheck:
      <<: *portal-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]

  # ── 可选：3004 旧版 Vue 静态站（apps/supplier-portal 只有 dist 产物）──
  # 默认不启动；启用：docker compose -f docker-compose.frontend.yml --profile vue-static up -d
  # 默认映射 3104 以免与 portal-3004 抢端口；若要顶替 Next 版，
  # 先 docker compose stop portal-3004，再把 VUE_SUP_PORT 设为 3004。
  supplier-vue-static:
    profiles: ["vue-static"]
    image: nginx:1.27-alpine
    container_name: water-supplier-vue
    restart: unless-stopped
    ports:
      - "${VUE_SUP_PORT:-3104}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 只读挂载仓库内已有的构建产物，不需要进镜像、不改原文件
      - ./apps/supplier-portal/dist:/usr/share/nginx/html:ro
      - ./docker/frontend/nginx-supplier-vue.conf:/etc/nginx/conf.d/default.conf:ro
