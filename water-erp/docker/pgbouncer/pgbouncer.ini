; water-erp pgbouncer 配置（由 docker/pgbouncer/Dockerfile 打入镜像）
; API 运行时经 6432 连接（DATABASE_URL?pgbouncer=true）；Prisma CLI 迁移走 5432 直连（DIRECT_URL）

[databases]
water_erp = host=postgres port=5432 user=water_erp password=water_erp_dev dbname=water_erp

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; 客户端认证：auth_file 内为明文口令，pgbouncer 用它对客户端做完整 scram-sha-256 认证
; （postgres:16 默认 scram 口令，md5/plain 会失败）
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; 管理控制台（连 dbname=pgbouncer 可执行 SHOW POOLS/STATS 等）
admin_users = water_erp

; transaction 池：Prisma 需配 ?pgbouncer=true（禁用 prepared statements 长连接语义）
pool_mode = transaction
; max_client_conn: 客户端侧上限（API + 偶发脚本）
max_client_conn = 200
; default_pool_size: 每 user/db 对的服务端连接数
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3

; Prisma 客户端会发 extra_float_digits=3
ignore_startup_parameters = extra_float_digits

stats_period = 60
log_connections = 0
log_disconnections = 0
verbose = 0
